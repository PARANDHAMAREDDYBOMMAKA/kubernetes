name: kaas

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  mongodb:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks: [kaas]
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  apiserver:
    image: ${DOCKERHUB_USERNAME:-local}/kube-apiserver:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile.apiserver
      args:
        BUILD_VERSION: ${IMAGE_TAG:-dev}
        BUILD_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped
    depends_on:
      mongodb: {condition: service_healthy}
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - MONGO_DB=${MONGO_DB:-kaas}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - KAAS_CLUSTER_PUBLIC_HOST=${SITE_HOST}
      - KAAS_K3S_READY_TIMEOUT=${KAAS_K3S_READY_TIMEOUT:-600}
    command: ["-addr", ":8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"
    networks: [kaas]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "/"
    restart: unless-stopped
    networks: [kaas]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 128M

  mongo-backup:
    image: mongo:7
    restart: unless-stopped
    depends_on:
      mongodb: {condition: service_healthy}
    environment:
      - MONGO_DB=${MONGO_DB:-kaas}
      - BACKUP_KEEP_DAYS=${BACKUP_KEEP_DAYS:-7}
      - BACKUP_CRON=${BACKUP_CRON:-0 3 * * *}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - mongo_backups:/backups
    entrypoint: >
      sh -c '
        apt-get update -qq &&
        apt-get install -y -qq cron >/dev/null &&
        echo "$${BACKUP_CRON} root MONGO_DB=$${MONGO_DB} BACKUP_KEEP_DAYS=$${BACKUP_KEEP_DAYS} /usr/local/bin/backup.sh >> /var/log/backup.log 2>&1" > /etc/cron.d/kaas-backup &&
        chmod 0644 /etc/cron.d/kaas-backup &&
        touch /var/log/backup.log &&
        cron &&
        tail -F /var/log/backup.log
      '
    networks: [kaas]
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - SITE_HOST=${SITE_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - apiserver
    networks: [kaas]
    logging: *default-logging

networks:
  kaas:

volumes:
  mongo_data:
  mongo_backups:
  caddy_data:
  caddy_config:
